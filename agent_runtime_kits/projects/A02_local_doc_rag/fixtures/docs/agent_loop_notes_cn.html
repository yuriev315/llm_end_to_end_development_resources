<h1>工具循环笔记（示意文档）</h1>
<p>ReAct 把推理（Reason）与行动（Act）交错：模型产出思考，调用工具，再观察结果，直到给出答案。</p>
<p>局限：工具返回值若含不可信文本，可能造成间接提示注入。循环需要步数上限、超时和可审计日志。</p>
<p>本资料库的 A01 项目实现了计算器、便笺和时间三种无网络工具。</p>
