<h1>RAG 与引用（示意文档）</h1>
<p>检索增强生成先把问题变成向量，在本地文档块中找近邻，再让模型只用检索到的片段作答。</p>
<p>引用要求：每个关键事实对应 chunk 编号与源文件路径。hash 嵌入只能做流水线演示，不能当作语义检索结果。</p>
<p>知识更新时要记录文档版本与切块时间，避免旧块与新块混用却不声明。</p>
